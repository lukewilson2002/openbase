# Weekly dependency updates, as pull requests that run the normal CI. Minor and patch updates are
# grouped into one pull request per ecosystem; major updates arrive one by one so they can be read.
# Nothing here publishes anything: a merged update reaches users only in the next release.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The pinned Watchtower image in the optional auto-update override.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
