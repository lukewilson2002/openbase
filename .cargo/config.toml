# Environment for ts-rs TypeScript export (`scripts/gen-types.sh`).
# Only read when ob-core is built with `--features ts`.
[env]
# Generated bindings land in the web client, next to the code that imports them.
TS_RS_EXPORT_DIR = { value = "web/src/api/types", relative = true }
# The wire format is JSON, where i64/u64 are plain numbers (ids and timestamps
# stay far below 2^53), so do not emit `bigint`.
TS_RS_LARGE_INT = "number"
