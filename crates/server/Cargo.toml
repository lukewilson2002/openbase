[package]
name = "openbase"
description = "OpenBase server: a self-hosted Airtable alternative in a single binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
default-run = "openbase"

[lib]
name = "openbase"
path = "src/lib.rs"

[[bin]]
name = "openbase"
path = "src/main.rs"

[features]
# Debug builds normally read web/dist from disk at run time (rust-embed's default); release builds
# embed it at compile time. This makes debug builds embed too, which is how the end-to-end tests
# exercise exactly what ships (`cargo build -p openbase --features debug-embed`).
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
ob-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true

anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "set-header", "limit", "timeout", "catch-panic", "request-id"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
subtle = "2"
totp-rs = { version = "6", features = ["otpauth", "gen_secret"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
csv = "1"
croner = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
flate2 = "1"
tar = "0.4"
url = "2"
http-body-util = "0.1"
unicode-normalization = "0.1.25"
webauthn-rs = { version = "=0.6.1-dev", default-features = false, features = ["conditional-ui"] }

[dev-dependencies]
tempfile = "3"
# A throwaway TLS certificate and server for the SMTP transport tests (tests/smtp_transport.rs).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
http-body-util = "0.1"
proptest = "1"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
# Passkey tests: SoftPasskey from webauthn-authenticator-rs is an independent implementation of
# the authenticator side (an interop check); tests/passkey_support is the authenticator the other
# tests use, because it can also hold discoverable credentials and set the signature counter.
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["softpasskey"] }
p256 = { version = "0.14", features = ["ecdsa"] }
serde_cbor_2 = "0.13"
