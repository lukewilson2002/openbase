[package]
name = "ob-core"
description = "OpenBase core: field types, cell values, formula engine and view query logic. Pure Rust, no I/O, compiles to WASM."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# Derive TypeScript bindings for the wire types (see scripts/gen-types.sh).
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }

[dev-dependencies]
proptest = "1"
