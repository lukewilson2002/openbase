# OpenBase behind Caddy (automatic HTTPS via Let's Encrypt).
#
#   cd deploy
#   cp .env.example .env      # set OPENBASE_DOMAIN (DNS must point here)
#   docker compose up -d --build
#
# Data lives in named volumes: `openbase-data` (database, attachments,
# backups) and `caddy-data` (TLS certificates). See docs/self-hosting.md.
#
# To try the stack on your own machine without a domain or certificates, add the
# override: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# (serves plain HTTP on http://localhost:8088).

services:
  openbase:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openbase:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENBASE_DATA_DIR: /data
      OPENBASE_BIND: 0.0.0.0:8080
      OPENBASE_PUBLIC_URL: https://${OPENBASE_DOMAIN:?set OPENBASE_DOMAIN in deploy/.env}
      # Only Caddy can reach OpenBase (no published port), so trust the client
      # address it puts in X-Forwarded-For.
      OPENBASE_TRUST_PROXY: "true"
    volumes:
      - openbase-data:/data
    # Not published on the host: reachable only through Caddy.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - openbase
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENBASE_DOMAIN: ${OPENBASE_DOMAIN:?set OPENBASE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  openbase-data:
  caddy-data:
  caddy-config:
