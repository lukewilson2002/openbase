[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukewilson2002/openbase"
homepage = "https://github.com/lukewilson2002/openbase"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
