[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukewilson2002/openbase"
homepage = "https://github.com/lukewilson2002/openbase"
rust-version = "1.89"

# The webauthn-rs and time security fixes need Rust 1.89 (SEC-1), and clippy gates its newer style
# lints on rust-version. These stay allowed until they get a cleanup commit of their own, so the
# dependency bump does not rewrite code it has nothing to do with.
[workspace.lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
regex = "1"
# The same parser regex uses, to size a pattern before it is run (see ob-core's regex functions).
regex-syntax = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
